name: Blog bot and site

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Test the translation only (no Telegram needed)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: site
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  ingest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Translation self-test
        if: inputs.selftest == true
        run: node ingest.mjs --selftest
      - id: ingest
        if: inputs.selftest != true
        run: node ingest.mjs
      - name: Commit new posts
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add posts
          git commit -m "New post from Telegram"
          git push

  build:
    needs: ingest
    if: >-
      always() && needs.ingest.result != 'failure' && needs.ingest.result != 'cancelled' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.ingest.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
